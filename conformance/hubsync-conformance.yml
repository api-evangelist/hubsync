domain_standard_conformance:
  asserted: false
  reason: >-
    Reward-only check, deliberately left unasserted. HubSync's market (US tax preparation) has
    genuine domain standards — IRS Modernized e-File (MeF) schemas and IRS Form 8879 e-signature
    requirements — and HubSync's e-File, batch-extension and 8879 e-sign modules necessarily
    speak them. But the check reads a declared standard inside a published contract, and HubSync
    publishes no contract. Claiming conformance from marketing copy would invent the signal the
    check exists to measure.
