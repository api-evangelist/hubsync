summary: >-
  HubSync runs a Docsie-hosted documentation portal that internally carries "Release Notes",
  "2025 Release Notes by Module" and "Release Notes and New Enhancements" shelves, but none of
  them is publicly readable, so no changelog could be captured. No status page, no versioning
  policy, no deprecation policy and no SLA are published. No StatusPage and no Deprecation
  pointer is emitted, because emitting one would assert a surface HubSync does not serve.
