aid: hubsync
name: HubSync
description: 'HubSync is an AI-powered, end-to-end tax and accounting workflow platform
  built for CPA firms, founded in 2019 by John McGowan and headquartered in Franklin, Tennessee.
  The SaaS platform unifies the engagement lifecycle in one interface: engagement letter
  generation and tracking, tax organizers and prepared-by-client data collection, document
  management, e-signature (including IRS Form 8879), batch federal and state extensions,
  tax return breakup and delivery, e-file status tracking, web-based tax workpapers,
  firm analytics dashboards, and integrated bill-and-pay. Its HubSync Halo layer adds
  agentic AI orchestration across those stages. HubSync publishes an llms.txt and states
  that it ships a Model Context Protocol (MCP) server and bi-directional API integrations
  with CCH Axcess/ProSystem fx, Thomson Reuters GoSystem/UltraTax and SurePrep, but it
  publishes no public developer portal, API reference, OpenAPI description or endpoint
  documentation — the entire integration surface is provisioned per customer firm.'
