summary: >-
  HubSync publicly states, in its own llms.txt and on its AI product page, that it operates an
  MCP server that third-party assistants (Microsoft Copilot, Claude, ChatGPT) connect to. The
  server is real and first-party, but HubSync publishes NO endpoint URL, NO connection
  instructions, NO tool list and NO input schemas anywhere on its public surface. Access appears
  to be provisioned per customer firm inside the tenant (firm subdomains such as
  <firm>.hubsync.com return HTTP 403 to anonymous requests). No tools/list call was possible.
